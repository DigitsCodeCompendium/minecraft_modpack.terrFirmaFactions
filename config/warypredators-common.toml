#Ramming animals (boar, moose, wildebeest, bison) use TFC's charge/ram AI, not the
#predator hunt AI, so they are configured separately here. 'Ram Distance' is how close
#a player must be before the animal considers charging; 'Ram Chance' is how likely it
#commits once you're in range. Being hit always provokes instantly regardless.
[rammers]
	#Master toggle. If false, ALL ramming animals behave exactly as vanilla TFC (no gating).
	rammersEnabled = true
	#If true, a ramming animal that a player hits (melee OR thrown weapon) will turn and charge
	#that player back, at any range, ignoring the wariness distance/chance gate for a while.
	#This is a realism addition on top of vanilla TFC, which normally never retaliates to ranged hits.
	rammersRetaliate = true
	#How long (seconds) a provoked ramming animal keeps pursuing the player who hit it.
	# Default: 12.0
	# Range: 1.0 ~ 120.0
	rammersRetaliateSeconds = 12.0
	#Fallback ram distance (blocks) for any ramming animal not listed individually.
	# Default: 6.0
	# Range: 0.5 ~ 64.0
	defaultRamDistance = 6.0
	#Fallback ram chance (0.0-1.0) for any ramming animal not listed individually.
	# Default: 0.7
	# Range: 0.0 ~ 1.0
	defaultRamChance = 0.7

	[rammers.boar]
		#Ram distance in blocks - how close a player must be before this animal considers charging.
		# Default: 8.0
		# Range: 0.5 ~ 64.0
		ramDistance = 8.0
		#Ram chance (0.0-1.0) once the player is within ram distance.
		# Default: 0.85
		# Range: 0.0 ~ 1.0
		ramChance = 0.85

	[rammers.moose]
		#Ram distance in blocks - how close a player must be before this animal considers charging.
		# Default: 6.0
		# Range: 0.5 ~ 64.0
		ramDistance = 6.0
		#Ram chance (0.0-1.0) once the player is within ram distance.
		# Default: 0.75
		# Range: 0.0 ~ 1.0
		ramChance = 0.75

	[rammers.bison]
		#Ram distance in blocks - how close a player must be before this animal considers charging.
		# Default: 5.0
		# Range: 0.5 ~ 64.0
		ramDistance = 5.0
		#Ram chance (0.0-1.0) once the player is within ram distance.
		# Default: 0.8
		# Range: 0.0 ~ 1.0
		ramChance = 0.8

	[rammers.wildebeest]
		#Ram distance in blocks - how close a player must be before this animal considers charging.
		# Default: 3.0
		# Range: 0.5 ~ 64.0
		ramDistance = 3.0
		#Ram chance (0.0-1.0) once the player is within ram distance.
		# Default: 0.15
		# Range: 0.0 ~ 1.0
		ramChance = 0.15

#Passive livestock that defend themselves with a short, escalating burst when a player
#attacks them (melee or thrown), instead of only fleeing. Being hit refreshes the window.
[defenders]
	#Master toggle. Default OFF - this is opt-in. When true, cow/yak/musk ox/goat/pig
	#defend themselves; when false they only flee, exactly like vanilla TFC.
	defendersEnabled = true
	#Base defensive-burst length (seconds). Each new hit the player lands refreshes it.
	# Default: 4.5
	# Range: 1.0 ~ 60.0
	defendersBurstSeconds = 4.5
	#Familiarity at or above which a livestock animal will NOT fight back - it trusts you and
	#just flees like vanilla. TFC familiarity runs 0.0-1.0; 0.3 is where an animal is bonded
	#enough to breed. Below this, half-wild or barely-tamed animals still defend themselves.
	#Set above 1.0 to make even fully-tame animals fight back.
	# Default: 0.3
	# Range: 0.0 ~ 2.0
	defendersFamiliarityThreshold = 0.3

	[defenders.cow]
		#Whether this animal fights back when attacked.
		enabled = true
		#Damage this animal deals to the player per defensive blow (half-hearts x2 = one heart per 2.0).
		# Default: 3.0
		# Range: 0.0 ~ 40.0
		hitDamage = 3.0

	[defenders.yak]
		#Whether this animal fights back when attacked.
		enabled = true
		#Damage this animal deals to the player per defensive blow (half-hearts x2 = one heart per 2.0).
		# Default: 3.0
