#Predators (bears, big cats, wolves/hyenas/direwolves, crocodiles). 'Enable Predator
#Gate' turns the whole predator system on or off; the defaults apply to any predator not
#listed individually; each species below overrides those defaults.
[predators]
	#Master toggle. If false, ALL predators behave exactly as vanilla TFC (attack on sight).
	predatorsEnabled = true
	#Fallback provoke distance (blocks) for any predator not listed individually.
	# Default: 8.0
	# Range: 0.5 ~ 64.0
	defaultProvokeDistance = 8.0
	#Fallback attack chance (0.0-1.0) once a player is within provoke distance.
	# Default: 1.0
	# Range: 0.0 ~ 1.0
	defaultAttackChance = 1.0
	#Fallback per-second chance (0.0-1.0) to disengage from a player mid-hunt. 0 disables.
	# Default: 0.0
	# Range: 0.0 ~ 1.0
	defaultBreakOffChance = 0.0

	[predators.grizzly_bear]
		#Provoke distance in blocks - how close a player must be before this animal considers attacking.
		# Default: 6.0
		# Range: 0.5 ~ 64.0
		provokeDistance = 6.0
		#Attack chance (0.0-1.0) once the player is within provoke distance.
		# Default: 0.9
		# Range: 0.0 ~ 1.0
		attackChance = 0.9
		#Per-second chance (0.0-1.0) to break off an attack on a player mid-hunt. 0 disables.
		# Default: 0.02
		# Range: 0.0 ~ 1.0
		breakOffChance = 0.02

