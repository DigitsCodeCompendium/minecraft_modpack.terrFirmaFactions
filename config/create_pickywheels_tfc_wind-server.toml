[windmills]
	#Whether TFC climate wind should modify Create PickyWheels windmill bonuses.
	enabled = true
	#TFC wind strength that counts as a neutral 1.0x multiplier.
	# Default: 0.25
	# Range: 0.01 ~ 10.0
	referenceWind = 0.25
	#Minimum multiplier applied to the PickyWheels windmill boost in calm wind.
	# Default: 0.25
	# Range: 0.0 ~ 10.0
	minimumMultiplier = 0.25
	#Maximum multiplier applied to the PickyWheels windmill boost in strong wind.
	# Default: 1.5
	# Range: 0.0 ~ 10.0
	maximumMultiplier = 1.5
