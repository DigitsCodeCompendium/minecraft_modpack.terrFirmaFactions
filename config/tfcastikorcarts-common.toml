[general]
	#
	# Max animal size that the animal cart can carry.
	# Default: 3.0
	# Range: 0.0 ~ 1.7976931348623157E308
	maxAnimalSize = 3.0
	#
	# Amount of animals the animal cart can carry.
	# Default: 2
	# Range: > 0
	maxPassengerCount = 2
	#
	# The largest (inclusive) size of an item that is allowed in a supply cart.
	#Allowed Values: TINY, VERY_SMALL, SMALL, NORMAL, LARGE, VERY_LARGE, HUGE
	maxItemSize = "VERY_LARGE"
	#
	# Can the animal cart pick up players by pushing it into them?
	canPushIntoPlayers = true
	#
	# Can the animal cart pick up water animals?
	canCarryWaterEntities = true
	#
	# Pulling distance modifier for carts. Higher => farther/greater break tolerance.
	# Default: 2.0
	# Range: 4.9E-324 ~ 1.7976931348623157E308
	pullingDistanceModifier = 2.0
	#
	# Should the player's average nutrient level and thirst affect the pulling speed of carts?
	toggleFoodSpeed = true
	#
	# If true, the plow cannot harvest crops. When driven over crops, it will break them
	#but only drop the seed item, regardless of the crop's growth stage. Mature crops
	#will not yield produce when broken by the plow.
	#This setting encourages players to use the reaper cart for proper crop harvesting.
	preventPlowFromHarvestingCrops = true

[cartInventories]
	#
	# Item weight is now estimated in kilograms based on size and density. For example, a VERY_HEAVY HUGE item may weigh ~280 kg. If the threshold is 800, the player can carry up to ~3 such items before becoming pinned.
	# Mass threshold (in kg) at which the player pulling a cart becomes exhausted. Higher values allow heavier cargo before exhaustion.
	# Default: 400.0
	# Range: 0.0 ~ 1.7976931348623157E308
	exhaustedThreshold = 400.0
	#
	# Mass threshold (in kg) at which the player pulling a cart becomes overburdened. Higher values allow heavier cargo before overburdening.
	# Default: 800.0
	# Range: 0.0 ~ 1.7976931348623157E308
	overburdenedThreshold = 800.0
	#
	# Mass threshold (in kg) at which the player pulling a cart becomes pinned and immobilized. Higher values allow heavier cargo before being pinned.
	# Default: 1400.0
	# Range: 0.0 ~ 1.7976931348623157E308
	pinnedThreshold = 1400.0
	#
	# Number of rows in the Hand Cart inventory
	# Default: 2
	# Range: > 1
	handCartInventoryHeight = 2
	#
	# Number of columns in the Hand Cart inventory
	# Default: 5
	# Range: > 1
	handCartInventoryWidth = 5
	#
	# Number of rows in the Supply Cart inventory
	# Default: 5
	# Range: > 1
	supplyCartInventoryHeight = 5
	#
	# Number of columns in the Supply Cart inventory
	# Default: 9
	# Range: > 1
	supplyCartInventoryWidth = 9
