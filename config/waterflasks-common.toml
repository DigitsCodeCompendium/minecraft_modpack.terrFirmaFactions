#Settings for Water Flasks
#Liquid Capacity of Leather Flask (500 = 1/2 bucket = 5 drinks or 2 water bars) Min 100, Max MAXINT
leatherCapacity = 500
#Damage Capability of Flasks are Capacity/(this value), 0 = MAXINT uses
damageFactor = 5
#Liquid Capacity of Iron Flask (1000 = 1 bucket = 10 drinks or 4 water bars) Min 100, Max MAXINT
