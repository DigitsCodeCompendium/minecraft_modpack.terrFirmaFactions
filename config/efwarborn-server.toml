#Paid faction chunks past the claim cap (uses SDM Economy).
[factionbuy]
	#Cost per chunk bought with /factionbuy.
	# Default: 500
	# Range: 0 ~ 1000000000
	chunkPrice = 500
	#SDM Economy currency key to charge. Leave blank to use the buyer's first unlocked currency.
	currencyKey = ""
	#If true, /factionbuy is only allowed once the faction is at its claim cap
	#(factionBaseClaimLimit + factionAdditionalClaimLimitPerMember * members).
	#If false, a faction can buy chunks at any time.
	requireAtCap = true
